<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ninja Bridge</title>
  <link rel="stylesheet" href="css.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="java.js?v=4" defer></script>
</head>
<body>
  <div class="container">
    <div id="score">0</div>
    
    <button id="leaderboardBtn" class="menu-btn" style="top:30px; left:30px; background:gold;">🏆 Skorlar</button>
    <button id="shopBtn" class="menu-btn" style="top:80px; left:30px; background:#4CAF50; color:white;">🛒 Market</button>
    
    <div id="coinDisplay" style="position:absolute; top:30px; right:100px; font-size:1.5em; font-weight:bold; background:rgba(255,255,255,0.8); padding:5px 15px; border-radius:15px; z-index:10; box-shadow:0 2px 5px rgba(0,0,0,0.3);">
      🪙 <span id="coinCount">0</span>
    </div>

    <div id="leaderboardModal" class="modal">
      <h2 style="margin-top:0;">Global Top 25</h2>
      <ul id="scoreList" class="modal-list"></ul>
      <button id="closeLeaderboard" class="close-btn">Kapat</button>
    </div>

    <div id="shopModal" class="modal">
      <h2 style="margin-top:0;">🛒 Kostüm Marketi</h2>
      <p style="font-weight:bold;">Bakiye: 🪙 <span id="shopCoinCount">0</span></p>
      <ul id="shopList" class="modal-list"></ul>
      <button id="closeShop" class="close-btn">Kapat</button>
    </div>

    <canvas id="game" width="375" height="375"></canvas>
    
    <div id="introduction">Köprüyü oluşturmak için ekrana basılı tutun.</div>
    <div id="perfect">2X SKOR</div>
    <button id="restart">TEKRAR DENE</button>
  </div>
</body>
</html>
